[project]
name = "diamond-genome"
version = "0.4.0"
description = "HELIXA — The Living Genome Studio. Python package name remains diamond-genome."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pymongo>=4.8.0",
    "pysam>=0.22.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
v8 = [
    "gepa==0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["services/tests"]
pythonpath = ["."]
