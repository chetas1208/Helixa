<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="HELIXA — Explore DNA. Understand change.">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#070b12"/>
      <stop offset="100%" stopColor="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#7fe3ff"/>
      <stop offset="100%" stopColor="#5aa0ff"/>
    </linearGradient>
    <linearGradient id="glow-uv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#bad2ff"/>
      <stop offset="100%" stopColor="#8ea2ff"/>
    </linearGradient>
    <radialGradient id="backdrop-radial" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stopColor="#1e3a8a" stopOpacity="0.25"/>
      <stop offset="100%" stopColor="#070b12" stopOpacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#backdrop-radial)"/>

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Centered Motif -->
  <g transform="translate(540, 110) scale(3.75)">
    <rect width="32" height="32" rx="8" fill="#0b1322" stroke="#253550" stroke-width="0.75"/>
    <path d="M8 5c3.2 3.4 3.2 6.2.4 9.2C11.2 17.2 11.2 20 8 27" fill="none" stroke="url(#glow-cyan)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M24 5c-3.2 3.4-3.2 6.2-.4 9.2C20.8 17.2 20.8 20 24 27" fill="none" stroke="url(#glow-uv)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M10.2 16h11.6" fill="none" stroke="#d7ecff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="310" text-anchor="middle" font-family="'Instrument Sans', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="0.22em" fill="#f8fafc">HELIXA</text>

  <!-- Tagline -->
  <text x="600" y="375" text-anchor="middle" font-family="'Instrument Sans', -apple-system, sans-serif" font-size="28" font-weight="500" letter-spacing="0.06em" fill="#7fe3ff">Explore DNA. Understand change.</text>

  <!-- Product Statement -->
  <text x="600" y="440" text-anchor="middle" font-family="'Instrument Sans', -apple-system, sans-serif" font-size="18" fill="#94a3b8">Interactive genome editor • Causal evidence • Hypothetical Earth evolution simulation</text>

  <!-- Footer / Research Notice -->
  <rect x="460" y="520" width="280" height="36" rx="18" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
  <text x="600" y="543" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" fill="#94a3b8">RESEARCH USE ONLY</text>
</svg>
