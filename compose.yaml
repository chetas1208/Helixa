services:
  mongodb:
    image: mongo:7.0
    container_name: diamond_mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: diamond_genome
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: diamond_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=diamond_genome
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      - mongodb
    volumes:
      - ./artifacts:/app/artifacts
      - ./fixtures:/app/fixtures

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: diamond_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
